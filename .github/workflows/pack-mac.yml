# Signed + notarized macOS DMG and a Windows NSIS installer (see README).
# The file name stays pack-mac.yml so this workflow's run number, and the
# marketing version 0.1.<run>, keep counting from the existing Mac packs.
name: Pack Mac and Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pack-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      HM_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bake the shared marketing version
        id: version
        run: |
          VERSION=$(node -e "const {resolveAppVersion}=require('./scripts/write-app-version.cjs'); const pkg=require('./package.json'); const info=resolveAppVersion(process.env, pkg.version); if (info.build==='dev') { console.error('HM_BUILD_NUMBER is missing'); process.exit(1); } process.stdout.write(info.version)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Marketing version ${VERSION}"

      - name: Open the GitHub Release for both installers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "$TAG" \
              --title "${VERSION}" \
              --notes "HuManuScript ${VERSION} for Apple silicon, Intel Mac, and Windows. Each installer is attached when its pack finishes."
          fi

  dmg:
    needs: release
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # Increments on every run of this workflow, including a cancelled one.
      # A numeric value becomes marketing version 0.1.<run> in the app and the DMG.
      HM_BUILD_NUMBER: ${{ github.run_number }}
      # Publish the signed, notarized build to GitHub Releases (electron-updater feed).
      HM_PUBLISH: always
      # Developer ID Application (.p12), base64-encoded — electron-builder accepts this form.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # Notarization (prefer App Store Connect API key; password flow also supported).
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require signing certificate secrets
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::Add repository secrets CSC_LINK (base64 .p12) and CSC_KEY_PASSWORD."
            exit 1
          fi

      - name: Require notarization secrets
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            if [ -z "$APPLE_API_KEY" ]; then
              echo "::error::APPLE_API_KEY_ID is set; add APPLE_API_KEY (contents of the .p8 file)."
              exit 1
            fi
            echo "Using App Store Connect API key for notarization."
            exit 0
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Using Apple ID app-specific password for notarization."
            exit 0
          fi
          echo "::error::Set either (APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER) or (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID)."
          exit 1

      - name: Install Apple notarization API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_API_KEY_ID" ]; then
            echo "No App Store Connect API key id; skipping key file install."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$KEY_PATH"
          echo >> "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run make:icns
      - name: Pack, sign, notarize, and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run pack:mac

      - uses: actions/upload-artifact@v4
        with:
          name: HuManuScript-dmg-arm64-signed
          path: release/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: latest-mac-arm64
          path: release/latest-mac.yml
          if-no-files-found: error

  dmg-intel:
    needs: release
    runs-on: macos-14
    timeout-minutes: 45
    env:
      HM_BUILD_NUMBER: ${{ github.run_number }}
      HM_PUBLISH: always
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require signing certificate secrets
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::Add repository secrets CSC_LINK (base64 .p12) and CSC_KEY_PASSWORD."
            exit 1
          fi

      - name: Require notarization secrets
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            if [ -z "$APPLE_API_KEY" ]; then
              echo "::error::APPLE_API_KEY_ID is set; add APPLE_API_KEY (contents of the .p8 file)."
              exit 1
            fi
            echo "Using App Store Connect API key for notarization."
            exit 0
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Using Apple ID app-specific password for notarization."
            exit 0
          fi
          echo "::error::Set either (APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER) or (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID)."
          exit 1

      - name: Install Apple notarization API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_API_KEY_ID" ]; then
            echo "No App Store Connect API key id; skipping key file install."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$KEY_PATH"
          echo >> "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run make:icns
      - name: Pack, sign, notarize, and publish the Intel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run pack:mac:intel

      - uses: actions/upload-artifact@v4
        with:
          name: HuManuScript-dmg-x64-signed
          path: release/*-x64.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: latest-mac-x64
          path: release/latest-mac.yml
          if-no-files-found: error

  mac-feed:
    needs: [release, dmg, dmg-intel]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: latest-mac-arm64
          path: feed/arm64

      - uses: actions/download-artifact@v4
        with:
          name: latest-mac-x64
          path: feed/x64

      - name: Publish one latest-mac.yml for both Macs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          node scripts/merge-mac-update-feed.cjs feed/arm64/latest-mac.yml feed/x64/latest-mac.yml feed/latest-mac.yml
          gh release upload "v${VERSION}" feed/latest-mac.yml --clobber

  windows:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Same run number as the Mac job, so both installers are 0.1.<run>.
      HM_BUILD_NUMBER: ${{ github.run_number }}
      HM_PUBLISH: always
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Pack and publish the Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional Windows Authenticode cert. Unset builds an unsigned installer.
          # Do not reuse the Apple CSC_LINK secret here.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run pack:win

      - uses: actions/upload-artifact@v4
        with:
          name: HuManuScript-win-x64
          path: release/*.exe
          if-no-files-found: error
