name: Pack Mac DMG

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run make:icns
      - run: npm run pack:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: HuManuScript-dmg-arm64
          path: release/*.dmg
          if-no-files-found: error
